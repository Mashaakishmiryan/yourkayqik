<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sona Avetisyan · Student CV</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root { --accent: #FF5C8A; --blue: #3D7BFF; --yellow: #FFD23F; --green: #2BD99F; --bg: #FFF1D6; --ink: #111; }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; font-family: "Archivo", sans-serif; background: var(--bg); color: var(--ink); line-height: 1.55; transition: background .3s; }
    h1, h2, h3 { font-family: "Archivo Black", sans-serif; font-weight: 400; margin: 0; line-height: 1.05; }
    p { margin: 0; }
    a { color: inherit; }
    .wrap { max-width: 1000px; margin: 0 auto; padding: 0 20px; }
    .box { background: #fff; border: 3px solid var(--ink); box-shadow: 6px 6px 0 var(--ink); border-radius: 14px; }
    .btn { display: inline-flex; align-items: center; gap: 8px; font: inherit; font-weight: 700; padding: 12px 20px; border: 3px solid var(--ink); border-radius: 12px; background: var(--accent); color: var(--ink); box-shadow: 4px 4px 0 var(--ink); text-decoration: none; cursor: pointer; transition: transform .1s, box-shadow .1s, background .3s; }
    .btn:hover { transform: translate(-2px, -2px); box-shadow: 6px 6px 0 var(--ink); }
    .btn:active { transform: translate(4px, 4px); box-shadow: 0 0 0 var(--ink); }
    .btn--white { background: #fff; }

    .top { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 22px 0; flex-wrap: wrap; }
    .swatches { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: .9rem; }
    .swatches button { width: 30px; height: 30px; border-radius: 50%; border: 3px solid var(--ink); cursor: pointer; transition: transform .15s; }
    .swatches button:hover { transform: scale(1.15); }
    .swatches button.on { box-shadow: 0 0 0 3px var(--bg), 0 0 0 6px var(--ink); }

    .hero { display: grid; grid-template-columns: auto 1fr; gap: 34px; align-items: center; padding: 30px 0 50px; }
    .avatar { width: 190px; height: 190px; border-radius: 50%; border: 3px solid var(--ink); box-shadow: 8px 8px 0 var(--ink); background: radial-gradient(circle at 50% 40%, var(--ink) 0 20%, transparent 21%), radial-gradient(ellipse at 50% 100%, var(--ink) 0 38%, transparent 39%), var(--accent); transition: background .3s; }
    .hero .hi { display: inline-block; background: var(--yellow); border: 3px solid var(--ink); padding: 4px 12px; font-weight: 700; transform: rotate(-2deg); border-radius: 8px; }
    .hero h1 { font-size: clamp(2.6rem, 8vw, 5rem); margin: 14px 0 10px; }
    .hero h1 span { background: var(--accent); padding: 0 10px; border: 3px solid var(--ink); display: inline-block; transform: rotate(1deg); transition: background .3s; }
    .hero p { font-size: 1.15rem; max-width: 34em; }
    .hero .actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 22px; }

    .grid { display: grid; grid-template-columns: 1.3fr 1fr; gap: 26px; padding-bottom: 60px; align-items: start; }
    .col { display: grid; gap: 26px; }
    .card { padding: 26px; }
    .card h2 { font-size: 1.6rem; margin-bottom: 18px; display: flex; align-items: center; gap: 10px; }
    .card h2 i { font-style: normal; display: grid; place-items: center; width: 40px; height: 40px; border: 3px solid var(--ink); border-radius: 10px; background: var(--yellow); font-size: 1.2rem; }

    .intern { border: 3px solid var(--ink); border-radius: 12px; margin-bottom: 12px; overflow: hidden; }
    .intern button { width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px 16px; font: inherit; background: #fff; border: 0; cursor: pointer; text-align: left; }
    .intern button b { display: block; font-size: 1.05rem; }
    .intern button small { color: #555; }
    .intern button span.plus { font-family: "Archivo Black"; font-size: 1.4rem; transition: transform .2s; }
    .intern.open button { background: var(--accent); transition: background .3s; }
    .intern.open button span.plus { transform: rotate(45deg); }
    .intern .more { max-height: 0; overflow: hidden; transition: max-height .3s; }
    .intern.open .more { max-height: 200px; }
    .intern .more p { padding: 14px 16px; border-top: 3px solid var(--ink); }

    .edu b { display: block; font-size: 1.1rem; }
    .gpa { display: inline-block; margin-top: 10px; background: var(--green); border: 3px solid var(--ink); border-radius: 8px; padding: 2px 10px; font-weight: 700; }

    .skill { margin-bottom: 14px; }
    .skill div { display: flex; justify-content: space-between; font-weight: 700; margin-bottom: 6px; }
    .bar { height: 18px; border: 3px solid var(--ink); border-radius: 999px; background: #fff; overflow: hidden; }
    .bar i { display: block; height: 100%; width: 0; background: var(--blue); border-right: 3px solid var(--ink); transition: width 1.2s cubic-bezier(.2,.8,.2,1); }

    .langs { display: grid; gap: 10px; }
    .lang { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; border: 3px solid var(--ink); border-radius: 10px; font-weight: 700; }
    .dots { display: flex; gap: 4px; }
    .dots i { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--ink); }
    .dots i.f { background: var(--accent); transition: background .3s; }

    .tags { display: flex; flex-wrap: wrap; gap: 8px; }
    .tags span { border: 3px solid var(--ink); border-radius: 999px; padding: 4px 12px; font-weight: 700; background: #fff; box-shadow: 3px 3px 0 var(--ink); transition: transform .15s; cursor: default; }
    .tags span:nth-child(3n+1):hover { background: var(--yellow); transform: rotate(-4deg); }
    .tags span:nth-child(3n+2):hover { background: var(--green); transform: rotate(3deg); }
    .tags span:nth-child(3n):hover { background: var(--blue); color: #fff; transform: rotate(-2deg); }

    .contact { text-align: center; padding: 34px 26px; background: var(--blue); color: #fff; }
    .contact h2 { font-size: clamp(1.8rem, 5vw, 2.6rem); }
    .contact .row { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 20px; }
    .toast { position: fixed; left: 50%; top: 20px; transform: translate(-50%, -150%); background: var(--yellow); border: 3px solid var(--ink); box-shadow: 4px 4px 0 var(--ink); padding: 10px 18px; border-radius: 10px; font-weight: 700; transition: transform .3s; z-index: 50; }
    .toast.show { transform: translate(-50%, 0); }
    footer { text-align: center; padding: 10px 0 100px; font-weight: 700; }

    @media print {
      body { background: #fff; }
      .top, .actions, .contact .row, .yk-badge { display: none !important; }
      .box { box-shadow: none; }
      .intern .more { max-height: none; }
      .bar i { transition: none; }
    }
    @media (max-width: 760px) {
      .hero { grid-template-columns: 1fr; text-align: left; }
      .avatar { width: 130px; height: 130px; }
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <strong style="font-family:'Archivo Black'" id="brand"></strong>
      <div class="swatches" id="swatches">
        <span>Pick my colour →</span>
        <button style="background:#FF5C8A" data-c="#FF5C8A" data-bg="#FFF1D6" class="on" aria-label="Pink"></button>
        <button style="background:#FFD23F" data-c="#FFD23F" data-bg="#EAF2FF" aria-label="Yellow"></button>
        <button style="background:#2BD99F" data-c="#2BD99F" data-bg="#FFF0F5" aria-label="Green"></button>
        <button style="background:#A78BFA" data-c="#A78BFA" data-bg="#FFFBE6" aria-label="Purple"></button>
      </div>
    </div>

    <header class="hero">
      <div class="avatar" aria-hidden="true"></div>
      <div>
        <span class="hi">👋 Hi! I'm</span>
        <h1><span data-text="firstName" style="background:none;border:0;padding:0;transform:none"></span> <span data-text="lastName"></span></h1>
        <p data-text="intro"></p>
        <div class="actions">
          <button class="btn" onclick="window.print()">⬇ Download PDF</button>
          <a class="btn btn--white" href="#contact">Contact me</a>
        </div>
      </div>
    </header>

    <div class="grid">
      <div class="col">
        <div class="card box">
          <h2><i>💼</i>Internships</h2>
          <div id="internships"></div>
        </div>

        <div class="card box edu">
          <h2><i>🎓</i>Education</h2>
          <b data-text="education.school"></b>
          <p data-text="education.degree"></p>
          <span class="gpa" data-text="education.gpa"></span>
        </div>

        <div class="card box">
          <h2><i>⭐</i>Interests</h2>
          <div class="tags" id="interests"></div>
        </div>
      </div>

      <div class="col">
        <div class="card box">
          <h2><i>⚡</i>Skills</h2>
          <div id="skills"></div>
        </div>

        <div class="card box">
          <h2><i>🌍</i>Languages</h2>
          <div class="langs" id="langs"></div>
        </div>
      </div>
    </div>

    <div class="contact box" id="contact">
      <h2>Let's work together!</h2>
      <p style="margin-top:8px">I reply within a day 💌</p>
      <div class="row">
        <button class="btn btn--white" id="copyEmail">📋 <span data-text="email"></span></button>
        <a class="btn btn--white" data-href="linkedin" target="_blank" rel="noopener">LinkedIn</a>
      </div>
    </div>
  </div>

  <footer data-text="footer"></footer>
  <div class="toast" id="toast">Copied! ✓</div>

  <script src="render.js"></script>
  <script src="data/student.js"></script>
  <script>
    // Fill the page from DATA
    document.title = `${DATA.firstName} ${DATA.lastName} · Student CV`;
    bindData(DATA);
    if (DATA.photo) document.querySelector(".avatar").style.background = `url("${DATA.photo}") center/cover`;
    document.getElementById("brand").textContent = `${DATA.firstName.toUpperCase()}.${DATA.lastName[0]}`;
    fill("#internships", DATA.internships, (x, i) => `
      <div class="intern${i === 0 ? " open" : ""}"><button><span><b>${esc(x.title)}</b><small>${esc(x.dates)}</small></span><span class="plus">+</span></button>
        <div class="more"><p>${esc(x.text)}</p></div></div>`);
    fill("#interests", DATA.interests, (t) => `<span>${esc(t)}</span>`);
    fill("#skills", DATA.skills, (s) =>
      `<div class="skill"><div><span>${esc(s.name)}</span><span>${+s.level}%</span></div><div class="bar"><i data-w="${+s.level}"></i></div></div>`);
    fill("#langs", DATA.languages, (l) =>
      `<div class="lang">${esc(l.name)}<span class="dots">${Array.from({ length: 5 }, (_, i) => `<i class="${i < l.level ? "f" : ""}"></i>`).join("")}</span></div>`);

    // Colour switcher
    document.getElementById("swatches").addEventListener("click", (e) => {
      const b = e.target.closest("button"); if (!b) return;
      document.documentElement.style.setProperty("--accent", b.dataset.c);
      document.documentElement.style.setProperty("--bg", b.dataset.bg);
      document.querySelectorAll("#swatches button").forEach((x) => x.classList.toggle("on", x === b));
    });

    // Internship accordion
    document.querySelectorAll(".intern button").forEach((b) =>
      b.addEventListener("click", () => b.parentElement.classList.toggle("open")));

    // Skill bars fill when visible
    const io = new IntersectionObserver((es) => es.forEach((e) => {
      if (e.isIntersecting) { e.target.style.width = e.target.dataset.w + "%"; io.unobserve(e.target); }
    }), { threshold: .5 });
    document.querySelectorAll(".bar i").forEach((b) => io.observe(b));
    addEventListener("beforeprint", () => document.querySelectorAll(".bar i").forEach((b) => (b.style.width = b.dataset.w + "%")));

    // Copy email
    const toast = document.getElementById("toast");
    document.getElementById("copyEmail").addEventListener("click", async () => {
      try { await navigator.clipboard.writeText(DATA.email); toast.textContent = "Copied! ✓"; }
      catch (e) { toast.textContent = DATA.email; }
      toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), 1800);
    });
  </script>
  <script src="badge.js"></script>
</body>
</html>
