<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Anna Petrosyan · Designer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #111111; --card: #1B1B1B; --line: #2C2C2C; --lime: #C6F432; --text: #F2F2F2; --soft: #9A9A9A; }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; font-family: "Space Grotesk", system-ui, sans-serif; background: var(--bg); color: var(--text); line-height: 1.55; }
    body.modal-open { overflow: hidden; }
    a { color: inherit; }
    h1, h2, h3 { margin: 0; line-height: 1.05; letter-spacing: -.03em; }
    p { margin: 0; }
    .wrap { max-width: 1160px; margin: 0 auto; padding: 0 22px; }
    .btn { display: inline-flex; align-items: center; gap: 8px; font: inherit; font-weight: 600; padding: 13px 22px; border-radius: 999px; border: 1.5px solid var(--lime); background: var(--lime); color: #111; text-decoration: none; cursor: pointer; transition: transform .15s, background .15s, color .15s; }
    .btn:hover { transform: translateY(-2px); }
    .btn--ghost { background: transparent; color: var(--lime); }
    .btn--ghost:hover { background: var(--lime); color: #111; }

    nav { position: sticky; top: 0; z-index: 20; background: rgba(17,17,17,.85); backdrop-filter: blur(10px); }
    nav .wrap { display: flex; justify-content: space-between; align-items: center; height: 68px; }
    .logo { font-weight: 700; font-size: 1.2rem; text-decoration: none; }
    .logo span { color: var(--lime); }
    .nav-links { display: flex; gap: 26px; color: var(--soft); }
    .nav-links a { text-decoration: none; }
    .nav-links a:hover { color: var(--lime); }

    .hero { padding: 90px 0 70px; }
    .avail { display: inline-flex; align-items: center; gap: 8px; color: var(--soft); font-size: .9rem; }
    .avail i { width: 8px; height: 8px; border-radius: 50%; background: var(--lime); box-shadow: 0 0 0 0 rgba(198,244,50,.6); animation: ping 1.8s infinite; }
    @keyframes ping { 70% { box-shadow: 0 0 0 10px rgba(198,244,50,0); } 100% { box-shadow: 0 0 0 0 rgba(198,244,50,0); } }
    .hero h1 { font-size: clamp(3rem, 10vw, 7.5rem); margin: 22px 0; font-weight: 700; }
    .hero h1 em { font-style: normal; color: var(--lime); }
    .roles { display: inline-block; min-width: 9ch; border-bottom: 4px solid var(--lime); }
    .hero .lead { font-size: 1.2rem; color: var(--soft); max-width: 36em; }
    .hero .actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 32px; }

    .marquee { border-block: 1px solid var(--line); overflow: hidden; padding: 18px 0; white-space: nowrap; }
    .marquee div { display: inline-block; animation: scroll 24s linear infinite; font-size: 1.4rem; font-weight: 600; color: var(--soft); }
    .marquee span { color: var(--lime); margin: 0 22px; }
    @keyframes scroll { to { transform: translateX(-50%); } }

    section { padding: 90px 0; }
    .head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 20px; margin-bottom: 34px; }
    .head h2 { font-size: clamp(2.2rem, 5vw, 3.6rem); }
    .filters { display: flex; flex-wrap: wrap; gap: 8px; }
    .filters button { font: inherit; padding: 8px 16px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--soft); cursor: pointer; transition: all .2s; }
    .filters button.active, .filters button:hover { border-color: var(--lime); color: var(--lime); }
    .filters button.active { background: var(--lime); color: #111; }

    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
    .project { background: var(--card); border-radius: 22px; overflow: hidden; cursor: pointer; border: 0; padding: 0; font: inherit; color: inherit; text-align: left; transition: transform .3s, opacity .3s; }
    .project.hide { display: none; }
    .project:hover { transform: translateY(-6px); }
    .project:hover .art { transform: scale(1.04); }
    .art-wrap { overflow: hidden; aspect-ratio: 4/3; }
    .art { width: 100%; height: 100%; transition: transform .5s; display: grid; place-items: center; font-weight: 700; font-size: 2rem; }
    .project .meta { padding: 18px 20px 20px; display: flex; justify-content: space-between; align-items: center; }
    .project h3 { font-size: 1.15rem; letter-spacing: -.01em; }
    .project small { color: var(--soft); }
    .project .arrow { width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--line); display: grid; place-items: center; transition: all .2s; }
    .project:hover .arrow { background: var(--lime); color: #111; transform: rotate(-45deg); }

    .a1 { background: linear-gradient(135deg, #C6F432, #8FD14F); color: #111; }
    .a2 { background: radial-gradient(circle at 30% 30%, #FF7A59 0 22%, transparent 23%), radial-gradient(circle at 70% 70%, #FFD25A 0 18%, transparent 19%), #2A1B4D; }
    .a3 { background: repeating-linear-gradient(45deg, #222 0 14px, #2D2D2D 14px 28px); color: var(--lime); }
    .a4 { background: linear-gradient(160deg, #F2F2F2, #CFCFCF); color: #111; }
    .a5 { background: conic-gradient(from 90deg, #C6F432, #3DDBD9, #6C4BF4, #C6F432); color: #111; }
    .a6 { background: #0E2F2A; color: #7CF2C4; }

    .about { display: grid; grid-template-columns: 1fr 1.2fr; gap: 60px; align-items: start; }
    .about .photo { aspect-ratio: 1; border-radius: 30px; background: radial-gradient(circle at 50% 40%, #2b2b2b 0 24%, transparent 25%), radial-gradient(ellipse at 50% 100%, #2b2b2b 0 40%, transparent 41%), var(--lime); }
    .about p { color: var(--soft); font-size: 1.1rem; margin-top: 18px; }
    .stats { display: flex; gap: 40px; margin-top: 32px; }
    .stats b { display: block; font-size: 2.6rem; color: var(--lime); }
    .skills { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 26px; }
    .skills span { border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; font-size: .9rem; }

    .contact { text-align: center; border-top: 1px solid var(--line); }
    .contact h2 { font-size: clamp(2.6rem, 9vw, 6rem); }
    .contact h2 a { text-decoration: none; transition: color .2s; }
    .contact h2 a:hover { color: var(--lime); }
    .socials { display: flex; justify-content: center; flex-wrap: wrap; gap: 12px; margin-top: 32px; }
    footer { text-align: center; color: var(--soft); padding: 20px 0 100px; font-size: .9rem; }

    .modal { position: fixed; inset: 0; z-index: 60; background: rgba(0,0,0,.75); display: none; align-items: center; justify-content: center; padding: 20px; }
    .modal.open { display: flex; }
    .modal-box { background: var(--card); border-radius: 26px; width: min(720px, 100%); max-height: 90vh; overflow: auto; animation: up .3s ease; }
    @keyframes up { from { transform: translateY(30px); opacity: 0; } }
    .modal-box .art { aspect-ratio: 16/9; height: auto; font-size: 3rem; }
    .modal-body { padding: 28px; }
    .modal-body h3 { font-size: 2rem; }
    .modal-body p { color: var(--soft); margin-top: 12px; }
    .modal-body .tags { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 18px; }
    .modal-body .tags span { background: #262626; border-radius: 999px; padding: 4px 12px; font-size: .85rem; }
    .close { position: absolute; top: 18px; right: 22px; width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--lime); font-size: 1.4rem; cursor: pointer; }

    /* Printable CV */
    #cv { display: none; }
    @media print {
      body { background: #fff; color: #111; }
      body > *:not(#cv) { display: none !important; }
      #cv { display: block; padding: 20px; font-size: 12pt; }
      #cv h1 { font-size: 26pt; }
      #cv h2 { font-size: 14pt; margin: 18px 0 6px; border-bottom: 2px solid #8FD14F; padding-bottom: 4px; }
      #cv p, #cv li { margin: 3px 0; }
    }

    @media (max-width: 860px) {
      .nav-links { display: none; }
      .grid { grid-template-columns: 1fr 1fr; }
      .about { grid-template-columns: 1fr; gap: 30px; }
      .about .photo { max-width: 280px; }
    }
    @media (max-width: 540px) {
      .grid { grid-template-columns: 1fr; }
      .stats { gap: 24px; }
      section { padding: 64px 0; }
    }
  </style>
</head>
<body>
  <nav>
    <div class="wrap">
      <a class="logo" href="#" id="logo"></a>
      <div class="nav-links"><a href="#work">Work</a><a href="#about">About</a><a href="#contact">Contact</a></div>
      <button class="btn btn--ghost" data-cv style="padding:8px 16px">Download CV ↓</button>
    </div>
  </nav>

  <header class="hero">
    <div class="wrap">
      <span class="avail"><i></i> <span data-text="availability"></span></span>
      <h1>Hi, I'm <span data-text="firstName"></span> —<br>I design <em class="roles" id="role"></em></h1>
      <p class="lead" data-text="intro"></p>
      <div class="actions">
        <a class="btn" href="#work">See my work</a>
        <button class="btn btn--ghost" data-cv>Download CV ↓</button>
      </div>
    </div>
  </header>

  <div class="marquee" aria-hidden="true"><div id="marquee"></div></div>

  <section id="work">
    <div class="wrap">
      <div class="head">
        <h2>Selected work</h2>
        <div class="filters" id="filters"></div>
      </div>
      <div class="grid" id="grid"></div>
    </div>
  </section>

  <section id="about">
    <div class="wrap about">
      <div class="photo" aria-hidden="true"></div>
      <div>
        <h2 style="font-size:clamp(2.2rem,5vw,3.4rem)">About me</h2>
        <div id="aboutText"></div>
        <div class="stats" id="stats"></div>
        <div class="skills" id="skills"></div>
      </div>
    </div>
  </section>

  <section class="contact" id="contact">
    <div class="wrap">
      <p style="color:var(--soft)">Have a project in mind?</p>
      <h2><a data-href="contactLink" target="_blank" rel="noopener">Let's talk ↗</a></h2>
      <div class="socials" id="socials"></div>
    </div>
  </section>

  <footer data-text="footer"></footer>

  <div class="modal" id="modal" role="dialog" aria-modal="true">
    <button class="close" aria-label="Close">×</button>
    <div class="modal-box"><div class="art" id="mArt"></div><div class="modal-body"><small id="mCat" style="color:var(--lime)"></small><h3 id="mTitle"></h3><p id="mText"></p><div class="tags" id="mTags"></div></div></div>
  </div>

  <div id="cv">
    <h1 data-text="fullName"></h1>
    <p data-text="cv.title"></p>
    <h2>Experience</h2>
    <ul id="cvExperience"></ul>
    <h2>Education</h2>
    <p data-text="cv.education"></p>
    <h2>Skills</h2>
    <p data-text="cv.skills"></p>
    <h2>Languages</h2>
    <p data-text="cv.languages"></p>
  </div>

  <script src="render.js"></script>
  <script src="data/portfolio.js"></script>
  <script>
    // Fill the page from DATA
    const [first, ...rest] = DATA.fullName.toLowerCase().split(" ");
    document.title = `${DATA.fullName} · Designer`;
    bindData(DATA);
    document.getElementById("logo").innerHTML = `${esc(first)}<span>.</span>${esc(rest.join(""))}`;
    document.getElementById("role").textContent = DATA.roles[0];
    const marquee = DATA.marquee.map(esc).join(" <span>✦</span> ") + " <span>✦</span> ";
    document.getElementById("marquee").innerHTML = marquee + marquee;
    const catLabel = Object.fromEntries(DATA.categories.map((c) => [c.id, c.label]));
    fill("#filters", [{ id: "all", label: "All" }, ...DATA.categories], (c, i) =>
      `<button class="${i === 0 ? "active" : ""}" data-filter="${esc(c.id)}">${esc(c.label)}</button>`);
    const cover = (p) => p.image ? `style="background:url('${esc(p.image)}') center/cover"` : "";
    fill("#grid", DATA.projects, (p, i) => `
      <button class="project" data-cat="${esc(p.category)}" data-i="${i}">
        <div class="art-wrap"><div class="art ${esc(p.art)}" ${cover(p)}>${p.image ? "" : esc(p.mark)}</div></div>
        <div class="meta"><div><h3>${esc(p.title)}</h3><small>${esc(catLabel[p.category])}</small></div><span class="arrow">→</span></div>
      </button>`);
    if (DATA.photo) document.querySelector(".about .photo").style.background = `url("${DATA.photo}") center/cover`;
    fill("#aboutText", DATA.about, (t) => `<p>${esc(t)}</p>`);
    fill("#stats", DATA.stats, (s) => `<div><b>${esc(s.value)}</b>${esc(s.label)}</div>`);
    fill("#skills", DATA.skills, (s) => `<span>${esc(s)}</span>`);
    fill("#socials", DATA.socials, (s) => `<a class="btn btn--ghost" href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.label)}</a>`);
    fill("#cvExperience", DATA.cv.experience, (x) => `<li><b>${esc(x.years)}</b> · ${esc(x.role)}</li>`);

    // Filters
    document.getElementById("filters").addEventListener("click", (e) => {
      const btn = e.target.closest("button"); if (!btn) return;
      document.querySelectorAll("#filters button").forEach((b) => b.classList.toggle("active", b === btn));
      document.querySelectorAll(".project").forEach((p) =>
        p.classList.toggle("hide", btn.dataset.filter !== "all" && p.dataset.cat !== btn.dataset.filter));
    });

    // Project modal
    const modal = document.getElementById("modal");
    document.getElementById("grid").addEventListener("click", (e) => {
      const card = e.target.closest(".project"); if (!card) return;
      const p = DATA.projects[card.dataset.i];
      const art = document.getElementById("mArt");
      art.className = "art " + p.art;
      art.style.cssText = p.image ? `background:url('${p.image}') center/cover` : "";
      art.textContent = p.image ? "" : p.mark;
      document.getElementById("mCat").textContent = catLabel[p.category];
      document.getElementById("mTitle").textContent = p.title;
      document.getElementById("mText").textContent = p.text;
      document.getElementById("mTags").innerHTML = p.tags.map((t) => `<span>${esc(t)}</span>`).join("");
      modal.classList.add("open"); document.body.classList.add("modal-open");
    });
    const closeModal = () => { modal.classList.remove("open"); document.body.classList.remove("modal-open"); };
    modal.addEventListener("click", (e) => { if (e.target === modal || e.target.classList.contains("close")) closeModal(); });
    addEventListener("keydown", (e) => e.key === "Escape" && closeModal());

    // Rotating role word
    let r = 0;
    setInterval(() => { r = (r + 1) % DATA.roles.length; document.getElementById("role").textContent = DATA.roles[r]; }, 1800);

    // CV → print dialog (choose "Save as PDF")
    document.querySelectorAll("[data-cv]").forEach((b) => b.addEventListener("click", () => window.print()));
  </script>
  <script src="badge.js"></script>
</body>
</html>
