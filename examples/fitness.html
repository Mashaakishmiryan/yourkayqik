<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mane Grigoryan · Fitness Coach</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --black: #0A0A0A; --dark: #151515; --line: #262626; --neon: #E8FF2B; --text: #F5F5F5; --soft: #9C9C9C; }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; background: var(--black); color: var(--text); font-family: "Manrope", sans-serif; line-height: 1.55; }
    h1, h2, h3, .big { font-family: "Anton", sans-serif; font-weight: 400; text-transform: uppercase; margin: 0; line-height: .95; letter-spacing: .01em; }
    p { margin: 0; }
    a { color: inherit; }
    .wrap { max-width: 1120px; margin: 0 auto; padding: 0 20px; }
    .btn { display: inline-flex; align-items: center; gap: 8px; font: inherit; font-weight: 800; text-transform: uppercase; letter-spacing: .05em; font-size: .9rem; padding: 15px 26px; background: var(--neon); color: var(--black); border: 2px solid var(--neon); text-decoration: none; cursor: pointer; transition: transform .15s, background .15s, color .15s; clip-path: polygon(8px 0, 100% 0, calc(100% - 8px) 100%, 0 100%); }
    .btn:hover { transform: translateY(-2px); }
    .btn--line { background: transparent; color: var(--neon); }
    .btn--line:hover { background: var(--neon); color: var(--black); }

    nav { position: fixed; top: 0; left: 0; right: 0; z-index: 20; transition: background .3s; }
    nav.scrolled { background: rgba(10,10,10,.92); backdrop-filter: blur(8px); }
    nav .wrap { display: flex; justify-content: space-between; align-items: center; height: 70px; }
    .logo { font-family: "Anton"; font-size: 1.5rem; letter-spacing: .04em; text-decoration: none; }
    .logo span { color: var(--neon); }

    .hero { min-height: 100vh; display: flex; align-items: center; padding: 110px 0 60px; position: relative; overflow: hidden; }
    .hero::before { content: "MOVE"; position: absolute; right: -4vw; bottom: -6vw; font-family: "Anton"; font-size: 34vw; color: #141414; line-height: 1; z-index: 0; }
    .hero .wrap { position: relative; z-index: 1; }
    .hero .kicker { color: var(--neon); font-weight: 800; letter-spacing: .2em; text-transform: uppercase; font-size: .85rem; }
    .hero h1 { font-size: clamp(3.6rem, 13vw, 9rem); margin: 16px 0 22px; }
    .hero h1 span { color: var(--neon); display: block; }
    .hero p.lead { max-width: 30em; color: var(--soft); font-size: 1.12rem; }
    .hero .actions { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 30px; }
    .numbers { display: flex; gap: 40px; margin-top: 50px; }
    .numbers b { font-family: "Anton"; font-size: 2.6rem; color: var(--neon); display: block; line-height: 1; }
    .numbers span { color: var(--soft); font-size: .85rem; }

    .strip { background: var(--neon); color: var(--black); overflow: hidden; padding: 14px 0; transform: rotate(-2deg); margin: 0 -20px; white-space: nowrap; }
    .strip div { display: inline-block; animation: run 18s linear infinite; font-family: "Anton"; font-size: 1.6rem; text-transform: uppercase; }
    @keyframes run { to { transform: translateX(-50%); } }

    section { padding: 100px 0; }
    .head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 20px; margin-bottom: 40px; }
    .head h2 { font-size: clamp(2.8rem, 7vw, 4.6rem); }
    .head h2 span { color: var(--neon); }

    .toggle { display: flex; background: var(--dark); border: 1px solid var(--line); padding: 4px; border-radius: 999px; }
    .toggle button { font: inherit; font-weight: 700; padding: 9px 18px; border-radius: 999px; border: 0; background: transparent; color: var(--soft); cursor: pointer; }
    .toggle button.on { background: var(--neon); color: var(--black); }

    .programs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
    .program { background: var(--dark); border: 1px solid var(--line); padding: 30px; display: flex; flex-direction: column; transition: border-color .2s, transform .2s; }
    .program:hover { border-color: var(--neon); transform: translateY(-4px); }
    .program.hot { border-color: var(--neon); position: relative; }
    .program.hot::before { content: "Most popular"; position: absolute; top: -13px; left: 24px; background: var(--neon); color: var(--black); font-weight: 800; font-size: .75rem; text-transform: uppercase; padding: 4px 10px; }
    .program-img { display: block; width: calc(100% + 60px); margin: -30px -30px 20px; aspect-ratio: 4/3; object-fit: cover; filter: grayscale(.3) contrast(1.05); }
    .program .emoji { font-size: 2rem; }
    .program h3 { font-size: 2rem; margin: 14px 0 8px; }
    .program p { color: var(--soft); }
    .program ul { padding: 0; margin: 18px 0 24px; list-style: none; display: grid; gap: 8px; }
    .program li::before { content: "→ "; color: var(--neon); }
    .price { font-family: "Anton"; font-size: 2.6rem; margin-top: auto; }
    .price small { font-family: "Manrope"; font-size: .9rem; color: var(--soft); }
    .program .btn { margin-top: 16px; justify-content: center; }

    .schedule { background: var(--dark); }
    .days { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 24px; }
    .days button { flex: none; font: inherit; font-weight: 800; text-transform: uppercase; padding: 12px 18px; background: transparent; border: 1px solid var(--line); color: var(--soft); cursor: pointer; }
    .days button.on { background: var(--neon); color: var(--black); border-color: var(--neon); }
    .slots { display: grid; gap: 10px; }
    .slot { display: grid; grid-template-columns: 90px 1fr auto auto; gap: 18px; align-items: center; padding: 18px 20px; border: 1px solid var(--line); background: var(--black); }
    .slot time { font-family: "Anton"; font-size: 1.6rem; color: var(--neon); }
    .slot .spots { color: var(--soft); font-size: .85rem; }
    .slot .spots.low { color: #FF6B4A; }
    .slot button { font: inherit; font-weight: 800; font-size: .8rem; text-transform: uppercase; padding: 10px 16px; border: 1px solid var(--neon); background: transparent; color: var(--neon); cursor: pointer; }
    .slot button:hover, .slot.picked button { background: var(--neon); color: var(--black); }
    .slot.picked { border-color: var(--neon); }

    .book { display: grid; grid-template-columns: 1fr 1fr; gap: 50px; align-items: center; }
    .book form { background: var(--dark); border: 1px solid var(--line); padding: 30px; display: grid; gap: 14px; }
    label { font-size: .8rem; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--soft); display: grid; gap: 6px; }
    input, select { font: inherit; font-size: 1rem; text-transform: none; letter-spacing: 0; padding: 13px 14px; background: var(--black); border: 1px solid var(--line); color: var(--text); }
    input:focus, select:focus { outline: 0; border-color: var(--neon); }
    .picked-slot { padding: 12px 14px; border: 1px dashed var(--line); color: var(--soft); }
    .picked-slot.has { border-color: var(--neon); color: var(--neon); font-weight: 700; }

    footer { border-top: 1px solid var(--line); padding: 30px 0 100px; text-align: center; color: var(--soft); }

    @media (max-width: 860px) {
      .programs, .book { grid-template-columns: 1fr; }
      .program.hot { order: -1; }
      .slot { grid-template-columns: 70px 1fr; }
      .slot .spots { grid-column: 2; }
      .slot button { grid-column: 1 / -1; }
      .numbers { gap: 24px; }
      section { padding: 72px 0; }
    }
  </style>
</head>
<body>
  <nav id="nav">
    <div class="wrap">
      <a class="logo" href="#" id="logo"></a>
      <a class="btn" href="#book" style="padding:10px 18px">Book</a>
    </div>
  </nav>

  <header class="hero">
    <div class="wrap">
      <p class="kicker" data-text="kicker"></p>
      <h1><span data-text="headline.0" style="display:inline;color:inherit"></span><span data-text="headline.1"></span></h1>
      <p class="lead" data-text="intro"></p>
      <div class="actions">
        <a class="btn" href="#schedule">Pick a class</a>
        <a class="btn btn--line" href="#programs">See programs</a>
      </div>
      <div class="numbers" id="numbers"></div>
    </div>
  </header>

  <div class="strip" aria-hidden="true"><div id="strip"></div></div>

  <section id="programs">
    <div class="wrap">
      <div class="head">
        <h2>Pro<span>grams</span></h2>
        <div class="toggle" id="toggle"><button class="on" data-mode="month">Monthly</button><button data-mode="single">Single class</button></div>
      </div>
      <div class="programs" id="programList"></div>
    </div>
  </section>

  <section class="schedule" id="schedule">
    <div class="wrap">
      <div class="head"><h2>This week's <span>classes</span></h2></div>
      <div class="days" id="days"></div>
      <div class="slots" id="slots"></div>
    </div>
  </section>

  <section id="book">
    <div class="wrap book">
      <div>
        <h2 style="font-size:clamp(2.8rem,7vw,4.6rem)">Let's <span style="color:var(--neon)">start</span></h2>
        <p style="color:var(--soft);margin-top:16px;font-size:1.1rem">Pick a class above or tell me your goal. The form opens WhatsApp with your message ready — I reply within an hour.</p>
      </div>
      <form id="form">
        <label>Your name<input name="name" required placeholder="Name"></label>
        <label>Program<select name="program" id="programSelect"></select></label>
        <label>Class<div class="picked-slot" id="picked">No class picked — I'll suggest one</div></label>
        <label>Your goal<select name="goal" id="goalSelect"></select></label>
        <button class="btn" type="submit" style="justify-content:center">Book on WhatsApp →</button>
      </form>
    </div>
  </section>

  <footer data-text="footer"></footer>

  <script src="render.js"></script>
  <script src="data/fitness.js"></script>
  <script>
    // Fill the page from DATA
    document.title = `${DATA.name} · ${DATA.title}`;
    bindData(DATA);
    document.getElementById("logo").innerHTML = `${esc(DATA.brand[0])}<span>.</span>${esc(DATA.brand[1])}`;
    if (DATA.heroImage) document.querySelector(".hero").style.background =
      `linear-gradient(90deg, #0A0A0A 30%, rgba(10,10,10,.6) 65%, rgba(10,10,10,.35)), url("${DATA.heroImage}") center/cover`;
    fill("#numbers", DATA.numbers, (n) => `<div><b>${esc(n.value)}</b><span>${esc(n.label)}</span></div>`);
    const strip = DATA.marquee.map(esc).join(" ✦ ") + " ✦ ";
    document.getElementById("strip").innerHTML = strip + strip + "&nbsp;";
    fill("#programList", DATA.programs, (p) => `
      <div class="program${p.popular ? " hot" : ""}">${p.image ? `<img class="program-img" src="${esc(p.image)}" alt="" loading="lazy">` : ""}<span class="emoji">${esc(p.emoji)}</span><h3>${esc(p.name)}</h3><p>${esc(p.text)}</p>
        <ul>${p.features.map((f) => `<li>${esc(f)}</li>`).join("")}</ul>
        <div class="price" data-month="${esc(p.month)}" data-single="${esc(p.single)}"></div>
        <a class="btn" href="#book" data-choose="${esc(p.name)}">Choose</a></div>`);
    fill("#programSelect", DATA.programs, (p) => `<option>${esc(p.name)}</option>`);
    fill("#goalSelect", DATA.goals, (g) => `<option>${esc(g)}</option>`);

    // Monthly / single price toggle
    const prices = document.querySelectorAll(".price");
    function showPrices(mode) {
      prices.forEach((p) => { p.innerHTML = `${esc(p.dataset[mode])} ֏ <small>/ ${mode === "month" ? "month" : "class"}</small>`; });
    }
    showPrices("month");
    document.getElementById("toggle").addEventListener("click", (e) => {
      const b = e.target.closest("button"); if (!b) return;
      document.querySelectorAll("#toggle button").forEach((x) => x.classList.toggle("on", x === b));
      showPrices(b.dataset.mode);
    });

    // "Choose" on a program fills the booking form
    const form = document.getElementById("form");
    document.querySelectorAll("[data-choose]").forEach((a) => a.addEventListener("click", () => { form.program.value = a.dataset.choose; }));

    // Weekly schedule
    const days = document.getElementById("days"), slots = document.getElementById("slots"), picked = document.getElementById("picked");
    let chosen = null;
    function renderDay(day) {
      days.querySelectorAll("button").forEach((b) => b.classList.toggle("on", b.textContent === day));
      slots.innerHTML = DATA.schedule[day].map(([t, name, left]) => {
        const slot = `${day} ${t} · ${name}`;
        return `<div class="slot${chosen === slot ? " picked" : ""}"><time>${esc(t)}</time><strong>${esc(name)}</strong>
          <span class="spots${left <= 3 ? " low" : ""}">${left <= 3 ? `Only ${left} spots left!` : `${left} spots left`}</span>
          <button data-slot="${esc(slot)}" data-program="${esc(name)}">Book</button></div>`;
      }).join("");
    }
    const dayKeys = Object.keys(DATA.schedule);
    fill("#days", dayKeys, (d) => `<button>${esc(d)}</button>`);
    days.addEventListener("click", (e) => e.target.tagName === "BUTTON" && renderDay(e.target.textContent));
    slots.addEventListener("click", (e) => {
      const b = e.target.closest("button[data-slot]"); if (!b) return;
      chosen = b.dataset.slot;
      picked.textContent = "✓ " + chosen;
      picked.classList.add("has");
      form.program.value = b.dataset.program;
      renderDay(chosen.split(" ")[0]);
      document.getElementById("book").scrollIntoView({ behavior: "smooth" });
    });
    const todayKey = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"][new Date().getDay()];
    renderDay(DATA.schedule[todayKey] ? todayKey : dayKeys[0]);

    // Booking → WhatsApp
    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const text = `Hi ${DATA.firstName}! I'm ${form.name.value}.\nProgram: ${form.program.value}\n${chosen ? "Class: " + chosen + "\n" : ""}Goal: ${form.goal.value}`;
      window.open(waLink(DATA.whatsapp, text), "_blank");
    });

    // Nav background on scroll
    const nav = document.getElementById("nav");
    addEventListener("scroll", () => nav.classList.toggle("scrolled", scrollY > 40));
  </script>
  <script src="badge.js"></script>
</body>
</html>
