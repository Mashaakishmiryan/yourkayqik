<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lilit turns 5! 🎈</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Fredoka:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root { --yellow: #FFE14D; --pink: #FF6FA8; --purple: #6C4BF4; --teal: #2EC4B6; --ink: #2D1B69; --white: #FFFDF7; }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; font-family: "Fredoka", sans-serif; color: var(--ink); background: var(--white); line-height: 1.55; overflow-x: hidden; }
    h1, h2, h3 { font-family: "Baloo 2", cursive; margin: 0; line-height: 1.05; }
    p { margin: 0; }
    .wrap { max-width: 960px; margin: 0 auto; padding: 0 20px; }
    .btn { display: inline-block; font: inherit; font-weight: 600; font-size: 1.1rem; padding: 14px 30px; border-radius: 999px; border: 3px solid var(--ink); background: var(--pink); color: #fff; text-decoration: none; cursor: pointer; box-shadow: 0 5px 0 var(--ink); transition: transform .12s, box-shadow .12s; }
    .btn:hover { transform: translateY(-2px) rotate(-1deg); box-shadow: 0 7px 0 var(--ink); }
    .btn:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--ink); }
    .btn--yellow { background: var(--yellow); color: var(--ink); }

    canvas#confetti { position: fixed; inset: 0; pointer-events: none; z-index: 50; }

    .hero { position: relative; min-height: 92vh; background: var(--yellow); display: grid; place-items: center; text-align: center; padding: 60px 20px 120px; overflow: hidden; }
    .hero::after { content: ""; position: absolute; left: -5%; right: -5%; bottom: -60px; height: 120px; background: var(--white); border-radius: 50% 50% 0 0; }
    .hero .tag { display: inline-block; background: #fff; border: 3px solid var(--ink); border-radius: 999px; padding: 6px 18px; font-weight: 600; transform: rotate(-3deg); }
    .five { font-family: "Baloo 2"; font-weight: 800; font-size: clamp(9rem, 32vw, 15rem); line-height: .9; color: var(--purple); text-shadow: 8px 8px 0 var(--pink); margin: 14px auto 0; cursor: pointer; display: block; width: fit-content; transition: transform .3s; }
    .five:hover { transform: rotate(-6deg) scale(1.05); }
    .hero h1 { font-size: clamp(2.6rem, 8vw, 4.4rem); color: var(--pink); -webkit-text-stroke: 2px var(--ink); paint-order: stroke fill; }
    .hero p.sub { font-size: 1.25rem; margin: 10px 0 26px; }
    .hero .hint { margin-top: 14px; font-size: .9rem; opacity: .7; }

    .balloon { position: absolute; width: 64px; height: 80px; border-radius: 50% 50% 48% 52% / 60% 60% 40% 40%; cursor: pointer; animation: rise 7s ease-in-out infinite; z-index: 2; border: 0; padding: 0; }
    .balloon::after { content: ""; position: absolute; left: 50%; top: 100%; width: 1.5px; height: 60px; background: rgba(45,27,105,.4); }
    .balloon::before { content: ""; position: absolute; left: 22%; top: 16%; width: 14px; height: 22px; border-radius: 50%; background: rgba(255,255,255,.45); }
    .balloon.popped { animation: pop .25s forwards; pointer-events: none; }
    @keyframes rise { 50% { transform: translateY(-22px) rotate(4deg); } }
    @keyframes pop { to { transform: scale(1.6); opacity: 0; } }
    .score { position: absolute; top: 18px; right: 18px; z-index: 3; background: #fff; border: 3px solid var(--ink); border-radius: 16px; padding: 6px 14px; font-weight: 600; }

    section { padding: 80px 0; }
    .title { font-size: clamp(2.2rem, 6vw, 3.2rem); text-align: center; margin-bottom: 34px; }
    .title span { color: var(--pink); }

    .count { display: flex; justify-content: center; gap: 14px; flex-wrap: wrap; }
    .count div { width: 110px; padding: 16px 0; border: 3px solid var(--ink); border-radius: 22px; text-align: center; box-shadow: 5px 5px 0 var(--ink); }
    .count div:nth-child(1) { background: var(--pink); color: #fff; transform: rotate(-3deg); }
    .count div:nth-child(2) { background: var(--teal); color: #fff; transform: rotate(2deg); }
    .count div:nth-child(3) { background: var(--yellow); transform: rotate(-2deg); }
    .count div:nth-child(4) { background: var(--purple); color: #fff; transform: rotate(3deg); }
    .count b { display: block; font-family: "Baloo 2"; font-size: 2.8rem; line-height: 1; }

    .info { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
    .card { background: #fff; border: 3px solid var(--ink); border-radius: 24px; padding: 24px; text-align: center; box-shadow: 6px 6px 0 var(--teal); }
    .card .emoji { font-size: 2.6rem; }
    .card h3 { font-size: 1.5rem; margin: 6px 0; }
    .card a { color: var(--purple); font-weight: 600; }

    .polaroids { display: flex; justify-content: center; flex-wrap: wrap; gap: 22px; }
    .polaroid { margin: 0; background: #fff; padding: 12px 12px 14px; border: 3px solid var(--ink); border-radius: 10px; box-shadow: 6px 6px 0 var(--ink); width: 250px; transition: transform .2s; }
    .polaroid:nth-child(1) { transform: rotate(-4deg); }
    .polaroid:nth-child(2) { transform: rotate(2deg) translateY(10px); }
    .polaroid:nth-child(3) { transform: rotate(-1deg); }
    .polaroid:hover { transform: rotate(0) scale(1.05); }
    .polaroid img { display: block; width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 4px; }
    .polaroid figcaption { font-family: "Baloo 2"; font-weight: 700; text-align: center; margin-top: 8px; font-size: 1.15rem; }
    .program { background: #F1ECFF; }
    .timeline { max-width: 560px; margin: 0 auto; display: grid; gap: 14px; }
    .step { display: flex; align-items: center; gap: 16px; background: #fff; border: 3px solid var(--ink); border-radius: 20px; padding: 14px 18px; cursor: pointer; transition: transform .15s; }
    .step:hover { transform: translateX(6px); }
    .step time { font-family: "Baloo 2"; font-weight: 800; font-size: 1.3rem; background: var(--yellow); border-radius: 12px; padding: 4px 10px; flex: none; }
    .step .emoji { font-size: 1.8rem; margin-left: auto; transition: transform .4s; }
    .step.wiggle .emoji { transform: rotate(360deg) scale(1.3); }

    .dress { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; max-width: 640px; margin: 0 auto; }
    .dress .card:first-child { box-shadow: 6px 6px 0 var(--pink); }
    .dress .card:last-child { box-shadow: 6px 6px 0 var(--purple); }

    .rsvp { background: var(--teal); }
    .rsvp .title { color: #fff; -webkit-text-stroke: 2px var(--ink); paint-order: stroke fill; }
    form { max-width: 520px; margin: 0 auto; background: #fff; border: 3px solid var(--ink); border-radius: 28px; padding: 28px; display: grid; gap: 16px; box-shadow: 8px 8px 0 var(--ink); }
    label { font-weight: 600; display: grid; gap: 6px; }
    input { font: inherit; padding: 12px 14px; border: 3px solid var(--ink); border-radius: 14px; }
    .stepper { display: flex; align-items: center; gap: 14px; }
    .stepper button { width: 44px; height: 44px; border-radius: 50%; border: 3px solid var(--ink); background: var(--yellow); font: inherit; font-size: 1.4rem; font-weight: 700; cursor: pointer; }
    .stepper output { font-family: "Baloo 2"; font-size: 2rem; min-width: 30px; text-align: center; }
    .thanks { display: none; text-align: center; }
    .thanks h3 { font-size: 2.2rem; color: var(--pink); }
    form.done > :not(.thanks) { display: none; }
    form.done .thanks { display: block; }
    footer { text-align: center; padding: 40px 20px 100px; font-size: 1.1rem; }

    @media (max-width: 720px) {
      .info, .dress { grid-template-columns: 1fr; }
      .count div { width: 72px; padding: 10px 0; border-radius: 16px; }
      .count b { font-size: 2rem; }
      .balloon { width: 48px; height: 60px; }
    }
  </style>
</head>
<body>
  <canvas id="confetti"></canvas>

  <header class="hero" id="hero">
    <div class="score" id="score">🎈 0 / 6</div>
    <div style="position:relative;z-index:2">
      <span class="tag">🎉 You're invited! 🎉</span>
      <div class="five" id="five" title="Tap me!" data-text="age"></div>
      <h1 id="headline"></h1>
      <p class="sub" data-text="tagline"></p>
      <a class="btn" href="#rsvp">I'm coming! 🎂</a>
      <p class="hint">Psst… pop all the balloons 🎈</p>
    </div>
  </header>

  <section>
    <div class="wrap">
      <h2 class="title">Party starts <span>in…</span></h2>
      <div class="count">
        <div><b id="d">0</b>days</div>
        <div><b id="h">0</b>hours</div>
        <div><b id="m">0</b>min</div>
        <div><b id="s">0</b>sec</div>
      </div>
    </div>
  </section>

  <section style="padding-top:0">
    <div class="wrap info">
      <div class="card"><div class="emoji">📅</div><h3>When</h3><p><span data-text="whenLabel"></span><br><span data-text="timeLabel"></span></p></div>
      <div class="card"><div class="emoji">📍</div><h3>Where</h3><p><span data-text="place"></span><br><a data-href="links.map" target="_blank" rel="noopener">Open map →</a></p></div>
      <div class="card"><div class="emoji">🎁</div><h3>Gift idea</h3><p data-text="giftIdea"></p></div>
    </div>
  </section>

  <section style="padding-top:0">
    <div class="wrap">
      <h2 class="title" id="memories">Party <span>memories</span></h2>
      <div class="polaroids" id="photos"></div>
    </div>
  </section>

  <section class="program">
    <div class="wrap">
      <h2 class="title">Party <span>program</span></h2>
      <div class="timeline" id="program"></div>
    </div>
  </section>

  <section>
    <div class="wrap">
      <h2 class="title">Dress <span>code</span></h2>
      <div class="dress" id="dress"></div>
    </div>
  </section>

  <section class="rsvp" id="rsvp">
    <div class="wrap">
      <h2 class="title">Will you come?</h2>
      <form id="form">
        <label>Child's name<input name="kid" required placeholder="e.g. Aram"></label>
        <label>Parent's phone<input name="phone" type="tel" required placeholder="0XX XX XX XX"></label>
        <div>
          <p style="font-weight:600;margin-bottom:6px">How many kids are coming?</p>
          <div class="stepper"><button type="button" data-step="-1">−</button><output id="kids">1</output><button type="button" data-step="1">+</button></div>
        </div>
        <button class="btn btn--yellow" type="submit">Yay, we're coming! 🎉</button>
        <div class="thanks"><h3>Hooray! 🎉</h3><p id="thanksText"></p></div>
      </form>
    </div>
  </section>

  <footer data-text="footer"></footer>

  <script src="render.js"></script>
  <script src="data/birthday.js"></script>
  <script>
    // Fill the page from DATA
    const headline = `${DATA.name} turns ${DATA.age}!`;
    DATA.links = { map: mapLink(DATA.mapQuery) };
    document.title = headline + " 🎈";
    bindData(DATA);
    document.getElementById("headline").textContent = headline;
    fill("#program", DATA.program, (p) =>
      `<div class="step"><time>${esc(p.time)}</time><span>${esc(p.what)}</span><span class="emoji">${esc(p.emoji)}</span></div>`);
    fill("#photos", DATA.photos, (p) =>
      `<figure class="polaroid"><img src="${esc(p.image)}" alt="${esc(p.caption)}" loading="lazy"><figcaption>${esc(p.caption)}</figcaption></figure>`);
    fill("#dress", DATA.dressCode, (d) =>
      `<div class="card"><div class="emoji">${esc(d.emoji)}</div><h3>${esc(d.title)}</h3><p>${esc(d.text)}</p></div>`);

    // Countdown
    const PARTY = new Date(DATA.start);
    const pad = (n) => String(n).padStart(2, "0");
    function tick() {
      let s = Math.max(0, Math.floor((PARTY - new Date()) / 1000));
      document.getElementById("d").textContent = Math.floor(s / 86400); s %= 86400;
      document.getElementById("h").textContent = pad(Math.floor(s / 3600));
      document.getElementById("m").textContent = pad(Math.floor((s % 3600) / 60));
      document.getElementById("s").textContent = pad(s % 60);
    }
    tick(); setInterval(tick, 1000);

    // Confetti
    const canvas = document.getElementById("confetti"), ctx = canvas.getContext("2d");
    const COLORS = ["#FF6FA8", "#6C4BF4", "#2EC4B6", "#FFE14D", "#FF9F1C"];
    let pieces = [];
    const resize = () => { canvas.width = innerWidth; canvas.height = innerHeight; };
    resize(); addEventListener("resize", resize);
    function burst(x = innerWidth / 2, y = innerHeight / 3, n = 120) {
      for (let i = 0; i < n; i++) pieces.push({
        x, y, vx: (Math.random() - .5) * 14, vy: Math.random() * -12 - 2, r: Math.random() * 6 + 4,
        c: COLORS[i % COLORS.length], a: Math.random() * 6, va: (Math.random() - .5) * .3, life: 0,
      });
    }
    (function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      pieces = pieces.filter((p) => p.y < canvas.height + 20 && p.life < 400);
      for (const p of pieces) {
        p.vy += .25; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.a += p.va; p.life++;
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.fillStyle = p.c;
        ctx.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2); ctx.restore();
      }
      requestAnimationFrame(draw);
    })();
    setTimeout(() => burst(), 400);
    document.getElementById("five").addEventListener("click", (e) => burst(e.clientX, e.clientY, 80));

    // Balloon game
    const hero = document.getElementById("hero"), score = document.getElementById("score");
    const spots = [[6, 14], [84, 20], [12, 62], [78, 60], [30, 8], [64, 6]];
    let popped = 0;
    spots.forEach(([x, y], i) => {
      const b = document.createElement("button");
      b.className = "balloon"; b.setAttribute("aria-label", "Pop the balloon");
      b.style.cssText = `left:${x}%;top:${y}%;background:${["#FF6FA8", "#6C4BF4", "#2EC4B6", "#FF9F1C"][i % 4]};animation-delay:${i * -1.1}s`;
      b.addEventListener("click", (e) => {
        b.classList.add("popped"); popped++;
        score.textContent = popped === spots.length ? "🏆 You did it!" : `🎈 ${popped} / ${spots.length}`;
        burst(e.clientX, e.clientY, popped === spots.length ? 200 : 30);
      });
      hero.appendChild(b);
    });

    // Program steps wiggle
    document.querySelectorAll(".step").forEach((s) => s.addEventListener("click", () => {
      s.classList.remove("wiggle"); void s.offsetWidth; s.classList.add("wiggle");
    }));

    // RSVP → sent to the parents on WhatsApp
    const kids = document.getElementById("kids");
    document.querySelectorAll("[data-step]").forEach((b) => b.addEventListener("click", () => {
      kids.textContent = Math.min(DATA.rsvp.maxKids, Math.max(1, +kids.textContent + +b.dataset.step));
    }));
    document.getElementById("form").addEventListener("submit", (e) => {
      e.preventDefault();
      const name = e.target.kid.value.trim();
      const n = +kids.textContent;
      document.getElementById("thanksText").textContent =
        `${name}${n > 1 ? ` + ${n - 1} more` : ""} — see you at the party! ${DATA.name} is so excited 💜`;
      e.target.classList.add("done");
      burst(innerWidth / 2, innerHeight / 2, 200);
      const text = `🎈 ${DATA.name}'s party RSVP\n${name} is coming! Kids: ${n}\nParent's phone: ${e.target.phone.value}`;
      setTimeout(() => window.open(waLink(DATA.rsvp.whatsapp, text), "_blank"), 600);
    });
  </script>
  <script src="badge.js"></script>
</body>
</html>
