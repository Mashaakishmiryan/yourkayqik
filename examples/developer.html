<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aram Sargsyan · Software Engineer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #0D1117; --panel: #161B22; --line: #30363D; --text: #E6EDF3; --soft: #8B949E; --green: #3FB950; --blue: #58A6FF; --purple: #D2A8FF; --orange: #FFA657; --red: #FF7B72; }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; background: var(--bg); color: var(--text); font-family: "Inter", system-ui, sans-serif; line-height: 1.6; }
    a { color: var(--blue); }
    h1, h2, h3 { margin: 0; line-height: 1.2; }
    p { margin: 0; }
    .mono { font-family: "JetBrains Mono", monospace; }
    .wrap { max-width: 1000px; margin: 0 auto; padding: 0 20px; }

    nav { border-bottom: 1px solid var(--line); position: sticky; top: 0; background: rgba(13,17,23,.9); backdrop-filter: blur(8px); z-index: 10; }
    nav .wrap { display: flex; justify-content: space-between; align-items: center; height: 60px; font-family: "JetBrains Mono", monospace; font-size: .9rem; }
    nav .links { display: flex; gap: 22px; }
    nav .links a { color: var(--soft); text-decoration: none; }
    nav .links a:hover { color: var(--text); }
    nav .links a::before { content: "./"; color: var(--green); }

    .hero { padding: 70px 0 40px; }
    .avatar { display: block; width: 96px; height: 96px; border-radius: 50%; object-fit: cover; border: 3px solid var(--green); box-shadow: 0 0 0 6px rgba(63,185,80,.15); margin-bottom: 22px; }
    .hello { color: var(--green); font-family: "JetBrains Mono", monospace; }
    .hero h1 { font-size: clamp(2.4rem, 7vw, 4.2rem); margin: 10px 0; letter-spacing: -.02em; }
    .hero h1 .cursor { display: inline-block; width: .5em; height: .9em; background: var(--green); vertical-align: -.08em; animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .typed { font-family: "JetBrains Mono", monospace; color: var(--purple); font-size: 1.15rem; min-height: 1.6em; }
    .hero .lead { color: var(--soft); margin-top: 16px; max-width: 38em; font-size: 1.08rem; }
    .actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 26px; }
    .btn { font-family: "JetBrains Mono", monospace; font-size: .9rem; padding: 11px 18px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--text); text-decoration: none; cursor: pointer; transition: border-color .2s, transform .15s; }
    .btn:hover { border-color: var(--green); transform: translateY(-2px); }
    .btn--green { background: #238636; border-color: #2EA043; }

    /* Terminal */
    .terminal { margin-top: 44px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; box-shadow: 0 20px 50px rgba(0,0,0,.4); }
    .term-bar { display: flex; align-items: center; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
    .term-bar i { width: 12px; height: 12px; border-radius: 50%; }
    .term-bar i:nth-child(1) { background: #FF5F56; } .term-bar i:nth-child(2) { background: #FFBD2E; } .term-bar i:nth-child(3) { background: #27C93F; }
    .term-bar span { margin-left: 10px; font-family: "JetBrains Mono", monospace; font-size: .8rem; color: var(--soft); }
    .term-body { padding: 16px 18px; height: 300px; overflow-y: auto; font-family: "JetBrains Mono", monospace; font-size: .88rem; cursor: text; }
    .term-body .line { white-space: pre-wrap; word-break: break-word; }
    .prompt { color: var(--green); }
    .prompt b { color: var(--blue); font-weight: 400; }
    .term-input { display: flex; gap: 8px; }
    .term-input input { flex: 1; background: transparent; border: 0; outline: 0; color: var(--text); font: inherit; caret-color: var(--green); }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 18px 14px; border-top: 1px solid var(--line); }
    .chips button { font-family: "JetBrains Mono", monospace; font-size: .78rem; padding: 4px 10px; border-radius: 6px; border: 1px solid var(--line); background: transparent; color: var(--soft); cursor: pointer; }
    .chips button:hover { color: var(--green); border-color: var(--green); }

    section { padding: 70px 0; }
    .sec-title { font-family: "JetBrains Mono", monospace; font-size: 1.5rem; margin-bottom: 28px; }
    .sec-title::before { content: "## "; color: var(--soft); }

    .stack { display: flex; flex-wrap: wrap; gap: 10px; }
    .tech { display: flex; align-items: center; gap: 8px; padding: 8px 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); font-family: "JetBrains Mono", monospace; font-size: .88rem; cursor: default; transition: border-color .2s, transform .2s; }
    .tech:hover { border-color: var(--c); transform: translateY(-3px); }
    .tech i { width: 10px; height: 10px; border-radius: 50%; background: var(--c); }

    .projects { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .repo { border: 1px solid var(--line); border-radius: 10px; padding: 20px; background: var(--panel); transition: border-color .2s; }
    .repo:hover { border-color: var(--blue); }
    .repo h3 { font-family: "JetBrains Mono", monospace; font-size: 1rem; color: var(--blue); }
    .repo h3::before { content: "📁 "; }
    .repo p { color: var(--soft); font-size: .93rem; margin: 8px 0 14px; }
    .repo .meta { display: flex; gap: 16px; font-size: .8rem; color: var(--soft); align-items: center; }
    .repo .meta i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; }
    .star { background: none; border: 0; color: var(--soft); font: inherit; cursor: pointer; padding: 0; }
    .star.on { color: #E3B341; }

    .exp { border-left: 2px solid var(--line); padding-left: 24px; display: grid; gap: 30px; }
    .job { position: relative; }
    .job::before { content: ""; position: absolute; left: -31px; top: 6px; width: 12px; height: 12px; border-radius: 50%; background: var(--bg); border: 2px solid var(--green); }
    .job small { font-family: "JetBrains Mono", monospace; color: var(--green); }
    .job h3 { font-size: 1.15rem; margin: 4px 0; }
    .job p { color: var(--soft); }

    .contact { text-align: center; }
    .contact h2 { font-size: clamp(1.8rem, 5vw, 2.6rem); }
    .contact p { color: var(--soft); margin: 12px 0 24px; }
    footer { text-align: center; padding: 20px 0 100px; color: var(--soft); font-family: "JetBrains Mono", monospace; font-size: .8rem; }

    @media (max-width: 720px) {
      nav .links { display: none; }
      .projects { grid-template-columns: 1fr; }
      .term-body { height: 260px; font-size: .8rem; }
    }
  </style>
</head>
<body>
  <nav>
    <div class="wrap">
      <span><span style="color:var(--green)">~/</span><span data-text="handle"></span></span>
      <div class="links"><a href="#stack">stack</a><a href="#projects">projects</a><a href="#experience">experience</a><a href="#contact">contact</a></div>
    </div>
  </nav>

  <header class="hero">
    <div class="wrap">
      <img class="avatar" id="avatar" alt="" width="96" height="96">
      <p class="hello">$ whoami</p>
      <h1><span data-text="name"></span><span class="cursor"></span></h1>
      <p class="typed" id="typed"></p>
      <p class="lead" data-text="intro"></p>
      <div class="actions">
        <a class="btn btn--green" href="#contact">Hire me →</a>
        <a class="btn" data-href="links.github" target="_blank" rel="noopener">GitHub</a>
        <button class="btn" onclick="window.print()">cv.pdf ↓</button>
      </div>

      <div class="terminal">
        <div class="term-bar"><i></i><i></i><i></i><span><span class="term-user"></span>: ~ — try typing "help"</span></div>
        <div class="term-body" id="term">
          <div id="out"></div>
          <div class="term-input"><span class="prompt"><span class="term-user"></span>:<b>~</b>$</span><input id="cmd" autocomplete="off" spellcheck="false" aria-label="Terminal command"></div>
        </div>
        <div class="chips" id="chips"><button>help</button><button>about</button><button>skills</button><button>projects</button><button>contact</button><button>coffee</button><button>clear</button></div>
      </div>
    </div>
  </header>

  <section id="stack">
    <div class="wrap">
      <h2 class="sec-title">tech stack</h2>
      <div class="stack" id="stackList"></div>
    </div>
  </section>

  <section id="projects" style="padding-top:0">
    <div class="wrap">
      <h2 class="sec-title">projects</h2>
      <div class="projects" id="projectList"></div>
    </div>
  </section>

  <section id="experience" style="padding-top:0">
    <div class="wrap">
      <h2 class="sec-title">experience</h2>
      <div class="exp" id="jobs"></div>
    </div>
  </section>

  <section class="contact" id="contact">
    <div class="wrap">
      <h2 class="mono">&lt;let's build something /&gt;</h2>
      <p data-text="contactText"></p>
      <div class="actions" style="justify-content:center">
        <a class="btn btn--green" data-href="links.linkedin" target="_blank" rel="noopener">LinkedIn</a>
        <a class="btn" data-href="links.telegram" target="_blank" rel="noopener">Telegram</a>
        <a class="btn" data-href="links.github" target="_blank" rel="noopener">GitHub</a>
      </div>
    </div>
  </section>

  <footer data-text="footer"></footer>

  <script src="render.js"></script>
  <script src="data/developer.js"></script>
  <script>
    // Fill the page from DATA
    const user = `${DATA.handle}@portfolio`;
    document.title = `${DATA.name} · ${DATA.title}`;
    bindData(DATA);
    const avatar = document.getElementById("avatar");
    if (DATA.photo) { avatar.src = DATA.photo; avatar.alt = DATA.name; } else avatar.remove();
    document.querySelectorAll(".term-user").forEach((el) => (el.textContent = user));
    fill("#stackList", DATA.stack, (t) => `<span class="tech" style="--c:${esc(t.color)}"><i></i>${esc(t.name)}</span>`);
    fill("#projectList", DATA.projects, (p) =>
      `<div class="repo"><h3>${esc(p.name)}</h3><p>${esc(p.text)}</p><div class="meta"><span><i style="background:${esc(p.color)}"></i>${esc(p.lang)}</span><button class="star" data-stars="${+p.stars}">☆ ${+p.stars}</button></div></div>`);
    fill("#jobs", DATA.experience, (j) => `<div class="job"><small>${esc(j.years)}</small><h3>${esc(j.title)}</h3><p>${esc(j.text)}</p></div>`);

    // Typing effect
    const typed = document.getElementById("typed");
    let li = 0, ci = 0, del = false;
    (function type() {
      const l = DATA.typedLines[li];
      typed.textContent = l.slice(0, ci);
      if (!del && ci < l.length) ci++;
      else if (!del) { del = true; return setTimeout(type, 1600); }
      else if (ci > 0) ci--;
      else { del = false; li = (li + 1) % DATA.typedLines.length; }
      setTimeout(type, del ? 25 : 55);
    })();

    // Interactive terminal
    const out = document.getElementById("out"), cmd = document.getElementById("cmd"), term = document.getElementById("term");
    const C = (color, t) => `<span style="color:var(--${color})">${t}</span>`;
    const width = Math.max(...DATA.projects.map((p) => p.name.length)) + 2;
    const COLORS = ["blue", "purple", "orange", "green"];
    const COMMANDS = {
      help: () => `Available commands:\n  ${C("green", "about")}     who I am\n  ${C("green", "skills")}    what I work with\n  ${C("green", "projects")}  things I've built\n  ${C("green", "contact")}   how to reach me\n  ${C("green", "coffee")}    ☕\n  ${C("green", "clear")}     clean the screen`,
      about: () => DATA.about.map(esc).join("\n"),
      skills: () => DATA.skills.map((s, i) => `${C(COLORS[i % 4], esc(s.group.padEnd(9)))}: ${esc(s.items)}`).join("\n"),
      projects: () => DATA.projects.map((p) => `→ ${esc(p.name.padEnd(width))}${C("soft", esc(p.short))}`).join("\n"),
      contact: () => DATA.contacts.map((c) => `${esc(c.label.padEnd(9))}: ${esc(c.value)}`).join("\n"),
      coffee: () => `   ( (\n    ) )\n  ........\n  |      |]\n  \\      /\n   \`----'\nBrewing… done. Productivity +100% ☕`,
      sudo: () => C("red", "Nice try 😄 Permission denied."),
      ls: () => "about.txt  skills.json  projects/  cv.pdf",
    };
    function print(html) { out.insertAdjacentHTML("beforeend", `<div class="line">${html}</div>`); term.scrollTop = term.scrollHeight; }
    function run(input) {
      const c = input.trim().toLowerCase();
      print(`<span class="prompt">${esc(user)}:<b>~</b>$</span> ${esc(c)}`);
      if (!c) return;
      if (c === "clear") { out.innerHTML = ""; return; }
      const key = c.split(" ")[0];
      print(COMMANDS[key] ? COMMANDS[key]() : `command not found: ${esc(key)} — type ${C("green", "help")}`);
    }
    print(`Welcome! Type ${C("green", "help")} or tap a command below 👇`);
    cmd.addEventListener("keydown", (e) => { if (e.key === "Enter") { run(cmd.value); cmd.value = ""; } });
    term.addEventListener("click", () => cmd.focus({ preventScroll: true }));
    document.getElementById("chips").addEventListener("click", (e) => { if (e.target.tagName === "BUTTON") run(e.target.textContent); });

    // Star repos
    document.querySelectorAll(".star").forEach((s) => s.addEventListener("click", () => {
      const on = s.classList.toggle("on");
      s.textContent = `${on ? "★" : "☆"} ${+s.dataset.stars + (on ? 1 : 0)}`;
    }));
  </script>
  <script src="badge.js"></script>
</body>
</html>
